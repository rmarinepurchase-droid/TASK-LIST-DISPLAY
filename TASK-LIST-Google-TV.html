<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TASK LIST - TV DISPLAY</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}
iframe {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: #000;
}
</style>
</head>
<body>
<iframe
  id="reportFrame"
  title="TASK LIST - DISPLAY"
  src="https://app.powerbi.com/reportEmbed?reportId=8a5d1580-c4ba-492f-876a-444fffcd9d2a&autoAuth=true&ctid=470708c8-600a-4ac3-9134-4e3ba10db227&filterPaneEnabled=false&navContentPaneEnabled=false&toolbarEnabled=false"
  allowfullscreen>
</iframe>

<script>
const baseUrl =
  "https://app.powerbi.com/reportEmbed?reportId=8a5d1580-c4ba-492f-876a-444fffcd9d2a&autoAuth=true&ctid=470708c8-600a-4ac3-9134-4e3ba10db227&filterPaneEnabled=false&navContentPaneEnabled=false&toolbarEnabled=false";

function refreshReport() {
  const frame = document.getElementById("reportFrame");
  frame.src = baseUrl + "&refresh=" + Date.now();
}

// Refresh every 10 minutes.
setInterval(refreshReport, 10 * 60 * 1000);

// Reload the page periodically as a recovery mechanism.
setInterval(() => {
  window.location.reload();
}, 60 * 60 * 1000);
</script>
</body>
</html>
