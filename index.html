<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TASK LIST - TV DISPLAY</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<div id="reportContainer"></div>
<script>
const baseUrl="https://app.powerbi.com/reportEmbed?reportId=8a5d1580-c4ba-492f-876a-444fffcd9d2a&autoAuth=true&ctid=470708c8-600a-4ac3-9134-4e3ba10db227&filterPaneEnabled=false&navContentPaneEnabled=false&toolbarEnabled=false";
function loadReport(){
  const c=document.getElementById("reportContainer");
  c.innerHTML="";
  const frame=document.createElement("iframe");
  frame.title="TASK LIST - DISPLAY";
  frame.allowFullscreen=true;
  frame.src=baseUrl+"&refresh="+Date.now();
  c.appendChild(frame);
}
loadReport();
setInterval(loadReport,120000);
</script>
</body>
</html>
